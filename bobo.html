<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bobo's Bear Jump</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<style>
		:root { --sky: #9bdcff; --grass: #69bd5b; --wood: #9b6339; }
		body { min-height: 100vh; background: linear-gradient(var(--sky) 0 64%, var(--grass) 64%); overflow-x: hidden; }
		.hero { min-height: 100vh; position: relative; overflow: hidden; }
		.sun { width: 100px; height: 100px; background: #ffd75a; border-radius: 50%; position: absolute; top: 7%; right: 10%; box-shadow: 0 0 35px #fff0a5; }
		.cloud { position: absolute; color: white; font-size: 4rem; opacity: .8; }
		.cloud.one { left: 8%; top: 12%; } .cloud.two { left: 42%; top: 25%; transform: scale(.7); }
		.scene { height: 430px; position: relative; margin-top: 1rem; }
		.fence { position: absolute; z-index: 3; bottom: 55px; left: 12%; width: 76%; height: 150px; border-top: 18px solid var(--wood); border-bottom: 18px solid var(--wood); background: repeating-linear-gradient(90deg, transparent 0 7%, var(--wood) 7% 10%, transparent 10% 17%); box-shadow: 0 5px 0 #704126; }
		.fence::after { content: ''; position: absolute; left: 0; right: 0; top: 64px; height: 18px; background: var(--wood); }
		.bear { position: absolute; z-index: 2; bottom: 65px; left: 8%; font-size: 5rem; filter: drop-shadow(3px 5px 1px #365c2d); animation: jump 4s ease-in-out infinite; }
		.bear.two { left: 28%; font-size: 4rem; animation-delay: 1.3s; }
		.bear.three { left: 52%; font-size: 4.5rem; animation-delay: 2.5s; }
		@keyframes jump { 0%, 18%, 100% { transform: translate(0, 0) rotate(0); } 42% { transform: translate(210px, -220px) rotate(-12deg); } 65% { transform: translate(390px, 0) rotate(8deg); } }
		.hill { position: absolute; bottom: 0; width: 120%; left: -10%; height: 95px; background: #4d9c48; border-radius: 50% 50% 0 0; }
		.card { background: rgba(255,255,255,.88); border: 0; box-shadow: 0 1rem 3rem rgba(25,70,90,.18); }
		@media (max-width: 600px) { .scene { height: 360px; } .fence { left: 5%; width: 90%; } @keyframes jump { 42% { transform: translate(100px, -180px) rotate(-12deg); } 65% { transform: translate(190px, 0) rotate(8deg); } } }
	</style>
</head>
<body>
	<main class="hero py-4">
		<div class="sun"></div><div class="cloud one">☁</div><div class="cloud two">☁</div>
		<div class="container text-center position-relative">
			<div class="card p-4 mx-auto" style="max-width: 620px;">
				<h1 class="display-5 fw-bold text-success">Bobo's Bear Jump</h1>
				<p class="lead mb-3">Watch the bears leap over the fence!</p>
				<button id="jumpBtn" class="btn btn-success btn-lg px-4">Make them jump</button>
				<span id="score" class="badge text-bg-warning ms-2 fs-6">Jumps: 0</span>
			</div>
			<section class="scene" aria-label="Animated bears jumping over a fence">
				<div class="bear">🐻</div><div class="bear two">🐻</div><div class="bear three">🐻</div>
				<div class="fence" aria-label="wooden fence"></div><div class="hill"></div>
			</section>
		</div>
	</main>
	<script>
		const bears = document.querySelectorAll('.bear');
		const button = document.querySelector('#jumpBtn');
		const score = document.querySelector('#score');
		let jumps = 0;
		button.addEventListener('click', () => {
			jumps++;
			score.textContent = `Jumps: ${jumps}`;
			bears.forEach((bear, index) => {
				bear.style.animation = 'none';
				void bear.offsetWidth;
				bear.style.animation = `jump 2.2s ease-in-out ${index * 0.18}s 1`;
			});
		});
	</script>
</body>
</html>
